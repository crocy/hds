const b64 = s => { const t = atob(s), u = new Uint8Array(t.length);
  for (let i=0;i<t.length;i++) u[i]=t.charCodeAt(i); return u.buffer; };
const pos = new Float32Array(b64(DATA.pos));
const idx = new Uint16Array(b64(DATA.idx));
const tq  = new Uint8Array(b64(DATA.tmp));
const temp = new Float32Array(tq.length);
for (let i=0;i<tq.length;i++) temp[i] = 20 + tq[i]*180/255;

/* inferno colour map */
const INF=[[0,0.0015,0.0005,0.0139],[0.1,0.0872,0.0448,0.2226],[0.2,0.2582,0.0386,0.4069],
 [0.3,0.4168,0.0906,0.4328],[0.4,0.5780,0.1480,0.4044],[0.5,0.7355,0.2154,0.3306],
 [0.6,0.8654,0.3169,0.2260],[0.7,0.9545,0.4682,0.0993],[0.8,0.9871,0.6520,0.0212],
 [0.9,0.9640,0.8433,0.2735],[1,0.9884,0.9983,0.6449]];
function cmap(t){ t=Math.max(0,Math.min(1,t));
  for(let i=0;i<INF.length-1;i++){ if(t<=INF[i+1][0]){
    const f=(t-INF[i][0])/(INF[i+1][0]-INF[i][0]);
    return [INF[i][1]+f*(INF[i+1][1]-INF[i][1]), INF[i][2]+f*(INF[i+1][2]-INF[i][2]),
            INF[i][3]+f*(INF[i+1][3]-INF[i][3])];}}
  return INF[INF.length-1].slice(1); }

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0c0c10);
const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,1,4000);
const rend=new THREE.WebGLRenderer({antialias:true});
rend.setSize(innerWidth,innerHeight); rend.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('c').appendChild(rend.domElement);

const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setIndex(new THREE.BufferAttribute(idx,1));
const col=new Float32Array(pos.length);
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
geo.computeVertexNormals();
function recolor(lo,hi){ for(let i=0;i<temp.length;i++){ const c=cmap((temp[i]-lo)/(hi-lo));
  col[3*i]=c[0]; col[3*i+1]=c[1]; col[3*i+2]=c[2]; } geo.attributes.color.needsUpdate=true; }
const mat=new THREE.MeshPhongMaterial({vertexColors:true,side:THREE.DoubleSide,
  shininess:14,specular:0x141414,flatShading:false});
const mesh=new THREE.Mesh(geo,mat); scene.add(mesh);
const wire=new THREE.LineSegments(new THREE.WireframeGeometry(geo),
  new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.13}));
wire.visible=false; scene.add(wire);
scene.add(new THREE.AmbientLight(0xffffff,.62));
const dl=new THREE.DirectionalLight(0xffffff,.55); dl.position.set(-260,-380,340); scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,.28); dl2.position.set(320,260,-160); scene.add(dl2);

/* orbit */
let th=-1.05, ph=1.02, R=560, tgt=new THREE.Vector3(0,0,0);
function place(){ cam.position.set(tgt.x+R*Math.sin(ph)*Math.cos(th),
  tgt.y+R*Math.sin(ph)*Math.sin(th), tgt.z+R*Math.cos(ph)); cam.up.set(0,0,1); cam.lookAt(tgt); }
place();
let drag=false,px=0,py=0;
const el=rend.domElement;
el.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointerup',e=>{drag=false;});
el.addEventListener('pointermove',e=>{
  if(drag){ th-=(e.clientX-px)*.0067; ph=Math.max(.06,Math.min(3.08,ph-(e.clientY-py)*.0067));
    px=e.clientX; py=e.clientY; place(); }
  else hover(e); });
el.addEventListener('wheel',e=>{e.preventDefault(); R=Math.max(190,Math.min(1500,R*(1+Math.sign(e.deltaY)*.09))); place();},{passive:false});

/* hover readout */
const ray=new THREE.Raycaster(), m2=new THREE.Vector2(), ro=document.getElementById('ro');
function hover(e){
  m2.x=(e.clientX/innerWidth)*2-1; m2.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(m2,cam);
  const h=ray.intersectObject(mesh);
  if(h.length){ const f=h[0].face;
    const t=(temp[f.a]+temp[f.b]+temp[f.c])/3;
    const p=h[0].point;
    ro.innerHTML='<b>'+t.toFixed(1)+' °C</b><span class="k">  &nbsp;X '+p.x.toFixed(0)+
      ' &nbsp;Y '+p.y.toFixed(0)+' &nbsp;Z '+p.z.toFixed(0)+' mm</span>';
    ro.style.display='block'; ro.style.left=(e.clientX+14)+'px'; ro.style.top=(e.clientY+14)+'px';
  } else ro.style.display='none'; }

/* legend + controls */
function legend(lo,hi){
  let st=[]; for(let i=0;i<=10;i++){ const c=cmap(i/10);
    st.push('rgb('+(c[0]*255|0)+','+(c[1]*255|0)+','+(c[2]*255|0)+') '+(i*10)+'%'); }
  document.getElementById('bar').style.background='linear-gradient(90deg,'+st.join(',')+')';
  let tk=''; for(let i=0;i<=4;i++) tk+='<span>'+Math.round(lo+(hi-lo)*i/4)+'</span>';
  document.getElementById('ticks').innerHTML=tk;
  document.getElementById('lt').textContent='surface temperature  ['+lo+'–'+hi+' °C]'; }
function setScale(lo,hi,on,off){ recolor(lo,hi); legend(lo,hi);
  document.getElementById(on).classList.add('on'); document.getElementById(off).classList.remove('on'); }
setScale(20,200,'b1','b2');
b1.onclick=()=>setScale(20,200,'b1','b2');
b2.onclick=()=>setScale(20,95,'b2','b1');
b3.onclick=()=>{th=-1.05;ph=1.02;R=560;place();};
b4.onclick=()=>{wire.visible=!wire.visible; b4.classList.toggle('on',wire.visible);};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  rend.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop); rend.render(scene,cam);})();
</script>
