name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm and Node in one step, replacing pnpm/action-setup and
      # actions/setup-node.
      #
      # version is set here rather than read from package.json's packageManager,
      # which pins 10.33.2: this action needs pnpm 11+, and 11 cannot run under
      # the corepack shim on the dev machine. The lockfile (v9) is byte-identical
      # under both majors, verified, so the split is safe until corepack is updated.
      - uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@22
          cache: true
          # The action would run a bare `pnpm install`; installing explicitly keeps
          # --frozen-lockfile visible, so lockfile drift fails the build out loud.
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
