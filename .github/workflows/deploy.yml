name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm and Node in one step, replacing pnpm/action-setup and
      # actions/setup-node.
      #
      # The version lives here rather than in package.json's packageManager: this
      # action needs pnpm 11+, and 11 will not run under the dev machine's corepack
      # 0.24.0 shim, so pinning 11 there would break local `pnpm`. The action also
      # refuses to run when both are set. The lockfile (v9) is byte-identical under
      # 10 and 11, verified, so CI and local agree on this tree despite the split.
      - uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@22
          cache: true
          # The action would run a bare `pnpm install`; installing explicitly keeps
          # --frozen-lockfile visible, so lockfile drift fails the build out loud.
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
